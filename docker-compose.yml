# Server-side secrets live in ./deploy.env (never committed). See DEPLOY.md.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: deploy.env
    volumes:
      - dcdata:/var/lib/dc
      - ./data:/srv/data            # orders.json and evidence documents; edit on the server, no rebuild
    mem_limit: 512m
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env next to this file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  dcdata:
  caddy_data:
